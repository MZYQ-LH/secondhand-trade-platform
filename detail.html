<!DOCTYPE html>
<!-- 商品详情页：URL 中携带商品 id，如 detail.html?id=1001
     内容由 detail.js 从后端接口读取并渲染（多图相册 / 拍下下单 / 私信卖家） -->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品详情 - 校园闲换</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <meta name="theme-color" content="#FF9FB8" />
    <link rel="stylesheet" href="css/theme.css" />
</head>

<body data-page="detail">

    <header class="header">
        <div class="container header-inner">

            <a class="logo" href="index.html">
                <img src="logo.svg" class="logo-icon">
                <span class="logo-brand">
                    <span class="logo-text">校园闲换</span>
                    <span class="logo-sub">捡漏、淘宝</span>
                </span>
            </a>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索闲置好物，比如 iPhone、自行车、教材…" />
                <button type="button" id="searchBtn">搜索</button>
            </div>

            <div class="header-actions">
                <a class="publish-btn" href="publish.html">＋ 发布闲置</a>
                <div class="user-chip" id="userChip"></div>
            </div>

        </div>
    </header>

    <!-- 分类栏：动态生成，点击回到首页对应分类 -->
    <nav class="cat-bar">
        <div class="container cat-inner" id="catBar"></div>
    </nav>

    <main class="container main">

        <div class="breadcrumb">
            <a href="index.html">首页</a>
            / <span id="bcCat">分类</span>
            / <span id="bcTitle">商品</span>
        </div>

        <div id="detailBox"></div>

        <div class="section-card" id="descCard" style="display:none;">
            <div class="section-title">商品描述</div>
            <div class="desc-text" id="detailDesc"></div>
        </div>

        <div class="related-section" id="relatedSection" style="display:none;">
            <div class="section-title">相关推荐</div>
            <div class="product-grid" id="relatedList"></div>
        </div>

    </main>

    <footer class="footer">
        校园闲换项目-课设web · © 2026
    </footer>

    <script src="js/data.js"></script>
    <script src="js/detail.js"></script>

    <!-- 樱花飘落花瓣背景：轻量无依赖，不遮挡内容与点击 -->
    <script src="js/petals.js"></script>
</body>
</html>
