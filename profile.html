<!DOCTYPE html>
<!-- 个人中心：我的发布 / 我的收藏 / 我的订单 / 站内私信 / 我的评价
     个人信息修改入口（昵称 / 头像 / 密码）与订单评价入口（1-5 星 + 文字评价）在本页弹窗中完成 -->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 - 校园闲换</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <meta name="theme-color" content="#FF9FB8" />
    <link rel="stylesheet" href="css/theme.css" />
</head>

<body data-page="profile">

    <header class="header">
        <div class="container header-inner">

            <a class="logo" href="index.html">
                <img src="logo.svg" class="logo-icon">
                <span class="logo-brand">
                    <span class="logo-text">校园闲换</span>
                    <span class="logo-sub">捡漏、淘宝</span>
                </span>
            </a>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索闲置好物，比如 iPhone、自行车、教材…" />
                <button type="button" id="searchBtn">搜索</button>
            </div>

            <div class="header-actions">
                <a class="publish-btn" href="publish.html">＋ 发布闲置</a>
                <div class="user-chip" id="userChip"></div>
            </div>

        </div>
    </header>

    <nav class="cat-bar">
        <div class="container cat-inner" id="catBar"></div>
    </nav>

    <main class="container main">

        <!-- 个人信息卡 -->
        <div class="profile-head" id="profileHead"></div>

        <!-- 标签页 -->
        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="posts">我发布的</button>
            <button class="tab" data-tab="fav">收藏 / 想要</button>
            <button class="tab" data-tab="orders">我的订单</button>
            <button class="tab" data-tab="msgs">私信 <span class="badge" id="msgBadge"
                    style="display:none;">0</span></button>
            <button class="tab" data-tab="reviews">我的评价</button>
        </div>

        <!-- 我发布的 -->
        <section class="tab-panel" id="panel-posts">
            <div class="product-grid" id="myProducts"></div>
        </section>

        <!-- 收藏 / 想要 -->
        <section class="tab-panel" id="panel-fav" style="display:none;">
            <div class="sub-tabs">
                <button class="sub-tab active" data-sub="favorite">我的收藏</button>
                <button class="sub-tab" data-sub="want">想要清单</button>
            </div>
            <div class="product-grid" id="favList"></div>
        </section>

        <!-- 我的订单 -->
        <section class="tab-panel" id="panel-orders" style="display:none;">
            <div class="sub-tabs">
                <button class="sub-tab active" data-role="buy">我买到的</button>
                <button class="sub-tab" data-role="sell">我卖出的</button>
            </div>
            <div id="orderList"></div>
        </section>

        <!-- 私信会话列表 -->
        <section class="tab-panel" id="panel-msgs" style="display:none;">
            <div id="convList"></div>
        </section>

        <!-- 我的评价：我发出的 / 我收到的 -->
        <section class="tab-panel" id="panel-reviews" style="display:none;">
            <div class="sub-tabs">
                <button class="sub-tab active" data-rrole="sent">我发出的评价</button>
                <button class="sub-tab" data-rrole="received">我收到的评价</button>
            </div>
            <div id="myReviewSummary"></div>
            <div id="myReviewList"></div>
        </section>

    </main>

    <!-- 个人信息修改弹窗：资料（昵称 / 头像）与密码两个表单，按入口切换显示 -->
    <div class="modal-mask" id="editMask">
        <div class="modal-box">
            <div class="modal-head">
                <span class="modal-title" id="editTitle">修改个人资料</span>
                <button type="button" class="modal-close" id="editClose">×</button>
            </div>
            <div class="auth-error" id="editError"></div>

            <!-- 资料表单：昵称 / 头像 -->
            <form class="modal-form" id="profileForm">
                <div class="form-item">
                    <label>登录账号（注册后不可修改）</label>
                    <input type="text" id="editUsername" disabled />
                </div>
                <div class="form-item">
                    <label><span class="required">*</span>昵称（1-20 个字符）</label>
                    <input type="text" id="editNickname" maxlength="20"
                        placeholder="想让大家怎么称呼你？" />
                </div>
                <div class="form-item">
                    <label>头像</label>
                    <div class="avatar-picker">
                        <span class="avatar avatar-lg" id="editAvatarPreview">用</span>
                        <div class="avatar-picker-side">
                            <label class="btn-mini solid" for="editAvatarFile">上传头像</label>
                            <button type="button" class="btn-mini" id="editAvatarClear">清除头像</button>
                            <div class="upload-tip">支持 jpg / png / webp / gif / bmp，单张 5MB 以内</div>
                        </div>
                    </div>
                    <input type="file" id="editAvatarFile" accept="image/*" style="display:none;" />
                </div>
                <button type="submit" class="submit-btn" id="profileSubmitBtn">保存修改</button>
            </form>

            <!-- 密码表单：需校验原密码，新密码与注册规则一致 -->
            <form class="modal-form" id="passwordForm" style="display:none;">
                <div class="form-item">
                    <label><span class="required">*</span>原密码</label>
                    <input type="password" id="oldPassword" maxlength="64"
                        placeholder="请输入当前登录密码" />
                </div>
                <div class="form-item">
                    <label><span class="required">*</span>新密码（6-64 位）</label>
                    <input type="password" id="newPassword" maxlength="64"
                        placeholder="至少 6 位字符" />
                </div>
                <div class="form-item">
                    <label><span class="required">*</span>确认新密码</label>
                    <input type="password" id="confirmPassword" maxlength="64"
                        placeholder="再输入一次新密码" />
                </div>
                <button type="submit" class="submit-btn" id="passwordSubmitBtn">确认修改密码</button>
            </form>
        </div>
    </div>

    <!-- 订单评价弹窗：1-5 星评分 + 文字评价（最多 200 字） -->
    <div class="modal-mask" id="reviewMask">
        <div class="modal-box">
            <div class="modal-head">
                <span class="modal-title">评价订单</span>
                <button type="button" class="modal-close" id="reviewClose">×</button>
            </div>
            <div class="review-target" id="reviewTarget"></div>
            <div class="form-item">
                <label><span class="required">*</span>评分（1-5 星）</label>
                <div class="star-picker" id="starPicker">
                    <button type="button" class="star" data-star="1">★</button>
                    <button type="button" class="star" data-star="2">★</button>
                    <button type="button" class="star" data-star="3">★</button>
                    <button type="button" class="star" data-star="4">★</button>
                    <button type="button" class="star" data-star="5">★</button>
                    <span class="star-tip" id="starTip">请选择评分</span>
                </div>
            </div>
            <div class="form-item">
                <label>评价内容（选填，最多 200 字）</label>
                <textarea id="reviewContent" rows="4" maxlength="200"
                    placeholder="说说商品成色、卖家服务、当面交接体验…"></textarea>
            </div>
            <button type="button" class="submit-btn" id="reviewSubmitBtn">提交评价</button>
        </div>
    </div>

    <footer class="footer">
        校园闲换项目-课设web · © 2026
    </footer>

    <script src="js/data.js"></script>
    <script src="js/profile.js"></script>

    <!-- 樱花飘落花瓣背景：轻量无依赖，不遮挡内容与点击 -->
    <script src="js/petals.js"></script>
</body>
</html>
